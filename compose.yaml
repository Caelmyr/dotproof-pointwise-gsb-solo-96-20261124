name: solo99-dotproof
services:
  desk:
    build:
      context: .
      args:
        DOTPROOF_RUNTIME_IMAGE: ${DOTPROOF_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${DOTPROOF_IMAGE:-solo99-dotproof:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${DOTPROOF_PORT:-19899}:8000"
    volumes:
      - proof-data:/var/lib/dotproof
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/dotproof/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  proof-data:
